<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Header content for links -->
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <!-- Open Graph Meta Tags for Social Media Sharing -->
    <meta property="og:title" content="Countdown | Tek Rexperts">
    <meta property="og:description" content="Countdown to the launch of the new ASA Cluster on 10/10/2026. Join the Discord community and be part of the launch!">
    <meta property="og:image" content="{% static 'images/og-image.png' %}">
    <meta property="og:url" content="https://ark.chaneyverse.app">
    <meta property="og:type" content="website">
    <!--Black Background Color-->
    <meta name="theme-color" content="#001a4d">
    <title>Countdown | Tek Rexperts</title>
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">
    

    <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Orbitron (Sci-Fi headers) & Inter (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;800;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ark: {
              teal: '#00f0ff',
              cyan: '#0ed9c8',
              amber: '#f59e0b',
              orange: '#f97316',
              dark: '#070b12',
              card: 'rgba(15, 23, 42, 0.75)',
              border: 'rgba(14, 217, 200, 0.22)',
            }
          },
          fontFamily: {
            orbitron: ['Orbitron', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* ARK Sci-Fi Hologram subtle scanline effect */
    .bg-scanlines {
      background: linear-gradient(
        rgba(18, 28, 48, 0) 50%, 
        rgba(0, 0, 0, 0.3) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.015),
        rgba(0, 255, 0, 0.005),
        rgba(0, 0, 255, 0.015)
      );
      background-size: 100% 4px, 6px 100%;
    }
    
    .glow-cyan {
      box-shadow: 0 0 20px -3px rgba(14, 217, 200, 0.35);
    }
    
    .glow-amber {
      box-shadow: 0 0 20px -3px rgba(245, 158, 11, 0.35);
    }

    .badge-clip {
      clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b111e;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #0ed9c8;
    }
  </style>

</head>

{% block content %}
{% endblock %}

</html>
